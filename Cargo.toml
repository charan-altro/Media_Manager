[workspace]
members = ["media_core", "apps/server", "apps/desktop", "apps/cli"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
walkdir = "2"
rayon = "1"
regex = "1"
once_cell = "1"
quick-xml = { version = "0.31", features = ["serialize"] }
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
md5 = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
opener = "0.7"
strsim = "0.11"
fs_extra = "1.3"
zip = "0.6"
chrono = "0.4"
dotenvy = "0.15"
scraper = "0.19"
html-escape = "0.2"
urlencoding = "2.1"
rust_xlsxwriter = "0.79"
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

